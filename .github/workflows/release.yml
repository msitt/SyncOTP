name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Publish self-contained
        run: >
          dotnet publish src\SyncOTP.App\SyncOTP.App.csproj
          --no-restore
          -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts\publish-selfcontained

      - name: Publish framework-dependent
        run: >
          dotnet publish src\SyncOTP.App\SyncOTP.App.csproj
          --no-restore
          -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=false
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts\publish-framework

      - name: Stamp release marker
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          @(
            @{ dir = 'artifacts\publish-selfcontained'; flavor = 'selfcontained' },
            @{ dir = 'artifacts\publish-framework';     flavor = 'framework-dependent' }
          ) | ForEach-Object {
            [ordered]@{ flavor = $_.flavor; version = $version; installedBy = 'release' } |
              ConvertTo-Json |
              Out-File -FilePath (Join-Path $_.dir 'release.json') -Encoding utf8
          }

      - name: Zip artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path artifacts\publish-selfcontained\* `
            -DestinationPath "SyncOTP-$version-win-x64-selfcontained.zip"
          Compress-Archive -Path artifacts\publish-framework\* `
            -DestinationPath "SyncOTP-$version-win-x64-framework-dependent.zip"

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 SyncOTP-*.zip |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Extract changelog section
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          $body = "See CHANGELOG.md for details."
          if ($start) {
            $rest = $lines[$start..($lines.Length - 1)]
            # Select-String returns every later version heading, so take the first. Its LineNumber
            # is 1-based over the sequence it was given, and that sequence was already skipped by
            # one, so the number indexes that heading inside $rest. Stop one short of it, or the
            # notes end with the heading of the release before this one.
            $next = $rest | Select-Object -Skip 1 |
              Select-String -Pattern "^## \[" | Select-Object -First 1
            if ($next) {
              $body = ($rest[0..($next.LineNumber - 1)] -join "`n").Trim()
            } else {
              $body = ($rest -join "`n").Trim()
            }
          }
          $body | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: |
            SyncOTP-*.zip
            SHA256SUMS.txt
