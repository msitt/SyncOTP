# Reference deployment. See ../../docs/ntfy-server.md for the user and token setup that goes with it.
services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      TZ: UTC
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-data:/var/lib/ntfy
    # No published port: cloudflared reaches the container over the shared network.
    # If you run cloudflared elsewhere, publish to localhost only:
    #   ports:
    #     - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/v1/health | grep -Fq '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ntfy-cache:
  ntfy-data:
